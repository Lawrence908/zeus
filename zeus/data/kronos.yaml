# zeus/data/kronos.yaml — Declarative seed jobs for Kronos.
# Loaded on every boot via KronosRegistry.seed_from_yaml(); insert-or-skip by id
# so edits to live jobs via the API are never clobbered. New ids added here
# appear on next boot; removing an id from this file does NOT delete it from
# the DB (use the API or set enabled=false in the running job).
#
# Only the newsletter job is enabled by default in Phase 1. Ingest and memory
# review seed as disabled placeholders while their built-in implementations
# land in Phase 2.

jobs:
  - id: newsletter-morning-digest
    name: Newsletter Morning Digest
    description: Morning newsletter summary + TTS audio; successor to the LAB-343 KAIROS observer idea.
    category: briefing
    schedule:
      cron: "0 7 * * *"
      timezone: America/Los_Angeles
    executor: zeus.kronos.jobs.newsletter.run_morning_digest
    params:
      newsletter_type: all
      num_recent: 3
    safety_policy: standard
    timeout_seconds: 600
    max_retries: 1
    tags: [newsletter, morning]
    enabled: true

  - id: nightly-knowledge-ingest
    name: Nightly Knowledge Ingest
    description: Re-run bulk knowledge ingest overnight. Built-in stub in Phase 1; real logic lands in Phase 2.
    category: ingest
    schedule:
      cron: "0 2 * * *"
    executor: zeus.kronos.jobs.ingest.run_nightly_ingest
    params:
      targets: [knowledge]
    safety_policy: ingest
    timeout_seconds: 1800
    max_retries: 0
    tags: [ingest, nightly]
    enabled: false

  - id: weekly-memory-review
    name: Weekly Memory Review
    description: Group MemoryStore additions from the last 7 days by category and source. Phase 2 returns a structured summary; no LLM call yet.
    category: memory_review
    schedule:
      cron: "0 18 * * 0"
      timezone: America/Los_Angeles
    executor: zeus.kronos.jobs.memory_review.run_weekly_review
    params:
      days: 7
      max_samples_per_category: 3
    safety_policy: memory
    timeout_seconds: 600
    max_retries: 0
    tags: [memory, weekly]
    enabled: false

  - id: hourly-service-health
    name: Hourly Service Health Probe
    description: Probe qdrant and ollama readiness, log degraded state. Disabled by default; enable when you want a heartbeat in the runs feed.
    category: health
    schedule:
      cron: "0 * * * *"
    executor: zeus.kronos.jobs.health_check.run_service_health
    safety_policy: standard
    timeout_seconds: 30
    max_retries: 0
    tags: [health, hourly]
    enabled: false

  - id: weekly-research-example
    name: "Weekly Research (example, disabled)"
    description: |
      Example deep-research run. Disabled by default. Clone via the API or
      duplicate this entry, edit `params.topic` (and depth/format if desired),
      and set enabled=true. Each fire writes a cited report into
      zeus/docs/research/<date>-<slug>.md. Most chat-triggered runs use a
      one-off run_at job created via the deep_research chat tool — this seed
      is here as a recurring-survey template (e.g. a weekly digest of an
      ongoing topic).
    category: research
    schedule:
      cron: "0 6 * * 1"
      timezone: America/Los_Angeles
    executor: zeus.kronos.jobs.deep_research.run_deep_research
    params:
      topic: "Replace with the topic you want surveyed weekly"
      depth: standard
      format: markdown
    safety_policy: standard
    timeout_seconds: 1800
    max_retries: 0
    tags: [research, weekly, example]
    enabled: false

  - id: daily-scrutiny-watch
    name: Daily Scrutiny Watch
    description: |
      Catches CapitolScope scrutiny + herding-cluster signals each morning,
      dedups against zeus/data/scrutiny_watch.db, LLM-triages new/intensifying
      signals, and auto-escalates only standouts (triage score >= threshold)
      into one-off deep_research jobs. Everything below the bar is flagged with
      a ready-to-run topic. Writes zeus/docs/briefings/<date>-scrutiny-watch.md
      plus inbox + knowledge writeback.

      Auto-escalation spawns web-research runs that spend search-API + small_llm
      budget, threshold-gated (score >= escalate_threshold) and hard-capped at
      max_escalations per cycle. Requires ZEUS_KRONOS_ALLOW_WRITE=1 so
      escalations can POST deep_research jobs. Reviewed + validated end-to-end
      2026-07-26; enabled.
    category: research
    schedule:
      cron: "0 8 * * *"
      timezone: America/Los_Angeles
    executor: zeus.kronos.jobs.scrutiny_watch.run_scrutiny_watch
    params:
      days: 7
      escalate_threshold: 8
      max_escalations: 2
      cooldown_days: 14
      depth: standard
      only_new: true
      providers: [ollama]   # hard-pin triage to local Ollama (free); null = DEFAULT_CHAIN
      model_hint: ollama
    safety_policy: standard
    timeout_seconds: 120
    max_retries: 1
    tags: [research, capitolscope, scrutiny, daily]
    enabled: true

  - id: pheme-daily-digest
    name: Pheme Daily News Digest
    description: >
      Pheme news pipeline: ingest Canary + CapitolScope into zeus_news,
      retention sweep, staged local-Ollama analysis (extract, cluster, thread,
      correlate, rank, synthesize), then delivery - Telegram push to the news
      chat and Twitter via the approval gate (autopost only when
      PHEME_TWITTER_AUTOPOST=1). Digest hour comes from PHEME_DIGEST_HOUR at
      seed time; edit the live job via /kronos to change it later.
    category: briefing
    schedule:
      cron: "0 ${PHEME_DIGEST_HOUR:-7} * * *"
      timezone: America/Los_Angeles
    executor: zeus.kronos.jobs.pheme.run_daily_digest
    params:
      news_days_back: 2
    safety_policy: pheme
    timeout_seconds: 3600
    max_retries: 1
    tags: [pheme, news, daily]
    enabled: true
