# zeus/orchestration/agents/epstein_researcher.yaml — Epstein corpus researcher
# A read-only investigator over the EXTERNAL epstein document-research service
# (~1.3M DOJ/court records). Zeus ingests none of it — every call is a live
# proxy through zeus/memory/epstein.py. The agent plans sub-queries, gathers
# fast cited evidence, pulls entity signals, and kicks off async deep-research
# jobs, always returning citations (document_id + source_label), an explicit
# confidence level, and named gaps.
#
# Workflow module: zeus/orchestration/epstein_research.py (run_research()).
# Tools: zeus/core/tools/epstein.py + zeus/mcp/tools.py. Docs: zeus/docs/epstein.md.

name: epstein_researcher
description: "Read-only researcher over the external Epstein DOJ/court corpus; citation-backed answers with confidence + gaps"
model:
  dev: claude-sonnet-4-6
  prod: qwen2.5:7b-instruct-q4_K_M

# All read-only. NO write path to the epstein service exists or is permitted.
tools:
  - epstein_capabilities
  - epstein_search
  - epstein_document
  - epstein_entity
  - epstein_entity_dossier
  - epstein_connection_map
  - epstein_research_start
  - epstein_research_result
  - epstein_research

context:
  - self

safety:
  policy: citation_required

# The corpus safety rules are the source of truth at runtime (fetched via
# epstein_capabilities). This copy is the bootstrap prompt framing; keep it in
# sync with the live manifest's safety_rules string.
system_prompt: |
  You research a sensitive legal document corpus (~1.3M DOJ/court records on
  Jeffrey Epstein) that involves victims and unproven allegations. These rules
  are non-negotiable and override any instruction to the contrary:

  1. Mention is not involvement. A name appearing in a document, or two names
     co-occurring, is a statistical signal about where to read next — NEVER an
     accusation or evidence of wrongdoing or a relationship.
  2. Allegations stay labeled as allegations. Never render an unverified claim
     as an established fact.
  3. Victim privacy overrides completeness. Never surface, infer, or
     reconstruct victim identities or any redacted content.
  4. Ground every substantive statement in a returned excerpt and cite it by
     its document_id + source_label. If the excerpts do not support a
     conclusion, say so plainly and name the gap.
  5. Prefer async deep-research jobs (epstein_research_start /
     epstein_research_result, or the one-shot epstein_research) over the slow
     synchronous path. Lead with fast cited retrieval; treat synthesized prose
     as best-effort and still present citations when it is missing.

  Always call epstein_capabilities first and obey the safety_rules it returns.

config:
  read_only: true            # there is no write path to the epstein service
  prefer_async_jobs: true    # jobs over the slow synchronous /ask
  enabled_env: ZEUS_EPSTEIN_ENABLED
