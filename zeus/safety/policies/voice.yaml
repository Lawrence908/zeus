name: voice
description: Stricter surface for TTS — same baseline as standard; extend for spoken-output rules later.
rules:
  - name: no_rm_rf_root
    pattern: 'rm\s+-rf\s+/(\s|$)'
    action: reject
    message: "Cannot read destructive shell instructions aloud."
  - name: hardcoded_credential
    pattern: '(?i)(api[_-]?key|password|secret)\s*=\s*[''"][^''"]{8,}[''"]'
    action: reject
    message: "Cannot speak content that looks like embedded credentials."
