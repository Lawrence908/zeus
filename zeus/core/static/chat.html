<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zeus Chat</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07090d;
      --panel: #0e1218;
      --border: #1c2530;
      --fg: #e8eef8;
      --muted: #6b7a90;
      --accent: #5c9eff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 0.75rem 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    header h1 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 600;
    }
    header nav a { color: var(--accent); margin-left: 1rem; }
    .layout {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr;
      gap: 0;
      min-height: 0;
    }
    @media (min-width: 900px) {
      .layout {
        grid-template-columns: minmax(280px, 38%) 1fr;
      }
    }
    #phaos-wrap {
      min-height: 260px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, #0a0e14 0%, #07090d 100%);
      display: flex;
      flex-direction: column;
      padding: 0.75rem;
    }
    @media (min-width: 900px) {
      #phaos-wrap {
        border-bottom: none;
        border-right: 1px solid var(--border);
        min-height: 100%;
      }
    }
    #phaos-root {
      flex: 1;
      min-height: 220px;
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
      position: relative;
    }
    .phaos-hint {
      font-size: 0.75rem;
      color: var(--muted);
      margin: 0.35rem 0 0;
    }
    #chat-panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 0.75rem 1rem 1rem;
    }
    .chat-inner {
      display: flex;
      flex: 1;
      flex-direction: column;
      gap: 0.65rem;
      min-height: 0;
    }
    @media (min-width: 900px) {
      .chat-inner {
        flex-direction: row;
        align-items: stretch;
      }
    }
    #sessions-aside {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel);
      padding: 0.5rem 0.6rem;
      max-height: 180px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    @media (min-width: 900px) {
      #sessions-aside {
        width: 220px;
        max-height: none;
        min-height: 0;
      }
    }
    #sessions-aside.collapsed {
      max-height: 2rem;
    }
    #sessions-aside.collapsed #session-list-wrap {
      display: none;
    }
    .sessions-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.35rem;
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }
    .sessions-head button {
      font-size: 0.7rem;
      padding: 0.15rem 0.4rem;
      background: #1a2434;
      border: 1px solid #2a3848;
      border-radius: 4px;
      color: var(--fg);
      cursor: pointer;
    }
    #session-list-wrap {
      overflow-y: auto;
      flex: 1;
      min-height: 0;
    }
    #session-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    #session-list li {
      font-size: 0.75rem;
      font-family: ui-monospace, monospace;
      padding: 0.35rem 0.4rem;
      border-radius: 6px;
      cursor: pointer;
      color: var(--muted);
      border: 1px solid transparent;
    }
    #session-list li:hover {
      background: #151b26;
      color: var(--fg);
    }
    #session-list li.active {
      border-color: #2a5080;
      color: var(--accent);
      background: #121a28;
    }
    .chat-main {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      min-width: 0;
    }
    #session-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
      font-size: 0.8rem;
      color: var(--muted);
    }
    #session-id { font-family: ui-monospace, monospace; color: var(--accent); }
    #transcript {
      flex: 1;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.75rem;
      background: var(--panel);
      margin-bottom: 0.65rem;
      min-height: 200px;
    }
    .msg { margin-bottom: 0.65rem; line-height: 1.45; font-size: 0.9rem; }
    .msg strong { color: #9ebdff; }
    .msg-meta {
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 0.25rem;
    }
    .composer {
      display: flex;
      gap: 0.5rem;
    }
    #msg-input {
      flex: 1;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--fg);
      padding: 0.55rem 0.65rem;
      font-size: 0.9rem;
    }
    #msg-input:focus {
      outline: none;
      border-color: var(--accent);
    }
    button#send {
      background: #1a2f4d;
      border: 1px solid #2a5080;
      color: var(--fg);
      padding: 0 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
    }
    button#send:disabled { opacity: 0.5; cursor: not-allowed; }
    .toast {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      background: #3d1515;
      border: 1px solid #662222;
      color: #ffcccc;
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      font-size: 0.85rem;
      max-width: 320px;
      display: none;
    }
    .toast.show { display: block; }
    #mic-btn {
      background: #1a2434;
      border: 1px solid #2a3848;
      border-radius: 4px;
      color: var(--fg);
      cursor: pointer;
      font-size: 1rem;
      padding: 0.35rem 0.55rem;
      line-height: 1;
      flex-shrink: 0;
      user-select: none;
      touch-action: none;
    }
    #mic-btn:hover { border-color: var(--accent); }
    #mic-btn.recording {
      background: #3d1010;
      border-color: #e05050;
      color: #ff6b6b;
      animation: mic-pulse 1s ease-in-out infinite;
    }
    @keyframes mic-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(224,80,80,0.5); }
      50%       { box-shadow: 0 0 0 5px rgba(224,80,80,0); }
    }
    #voice-status {
      font-size: 0.72rem;
      color: var(--muted);
      min-height: 1rem;
      margin-top: 0.25rem;
      text-align: right;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <header>
    <h1>Zeus</h1>
    <nav>
      <span id="env-badge" class="muted"></span>
      <a href="/viz">Phaos</a>
      <a href="/status">Status</a>
    </nav>
  </header>
  <div class="layout">
    <aside id="phaos-wrap">
      <div id="phaos-root" aria-label="Voice visualization"></div>
      <p class="phaos-hint">Phaos reacts to <code>/ws/voice-state</code>. Mic levels blend in while <em>listening</em> (click page once if audio is suspended).</p>
    </aside>
    <main id="chat-panel">
      <div class="chat-inner">
        <aside id="sessions-aside" aria-label="Recent sessions">
          <div class="sessions-head">
            <span>Sessions</span>
            <span style="display:flex;gap:0.25rem;">
              <button type="button" id="refresh-sessions" title="Refresh list">Refresh</button>
              <button type="button" id="toggle-sessions" title="Collapse">▾</button>
            </span>
          </div>
          <div id="session-list-wrap">
            <ul id="session-list"></ul>
          </div>
        </aside>
        <div class="chat-main">
          <div id="session-row">
            Session: <span id="session-id">—</span>
            <button type="button" id="new-session" style="font-size:0.75rem;padding:0.2rem 0.45rem;background:#1a2434;border:1px solid #2a3848;border-radius:4px;color:var(--fg);cursor:pointer;">New</button>
          </div>
          <div id="transcript"></div>
          <form class="composer" id="chat-form">
            <input type="text" id="msg-input" placeholder="Message Zeus…" autocomplete="off" />
            <button type="button" id="mic-btn" title="Hold to talk">🎤</button>
            <button type="submit" id="send">Send</button>
          </form>
          <div id="voice-status"></div>
        </div>
      </div>
    </main>
  </div>
  <div id="toast" class="toast" role="status"></div>

  <script type="module">
    import { initPhaos } from '/static/viz/phaos.js';

    const transcript = document.getElementById('transcript');
    const sessionEl = document.getElementById('session-id');
    const input = document.getElementById('msg-input');
    const form = document.getElementById('chat-form');
    const sendBtn = document.getElementById('send');
    const toast = document.getElementById('toast');
    const phaosRoot = document.getElementById('phaos-root');
    const sessionListEl = document.getElementById('session-list');
    const sessionsAside = document.getElementById('sessions-aside');

    let sessionId = null;

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 5000);
    }

    function appendMessage(role, text, metaText) {
      const div = document.createElement('div');
      div.className = 'msg';
      div.innerHTML = `<strong>${role}:</strong> `;
      div.appendChild(document.createTextNode(text));
      if (metaText) {
        const meta = document.createElement('div');
        meta.className = 'msg-meta';
        meta.textContent = metaText;
        div.appendChild(meta);
      }
      transcript.appendChild(div);
      transcript.scrollTop = transcript.scrollHeight;
      return div;
    }

    function appendAssistantStreaming() {
      const div = document.createElement('div');
      div.className = 'msg';
      div.innerHTML =
        '<strong>Zeus:</strong> <span class="assistant-body"></span><div class="msg-meta"></div>';
      transcript.appendChild(div);
      transcript.scrollTop = transcript.scrollHeight;
      return div;
    }

    async function refreshSessionList() {
      try {
        const r = await fetch('/chat/sessions?limit=15');
        if (!r.ok) return;
        const data = await r.json();
        const sessions = data.sessions || [];
        sessionListEl.innerHTML = '';
        sessions.forEach((s) => {
          const li = document.createElement('li');
          li.dataset.id = s.id;
          li.textContent = `${s.id.slice(0, 8)}… · ${s.turn_count} turns`;
          if (s.id === sessionId) li.classList.add('active');
          li.addEventListener('click', () => loadSession(s.id));
          sessionListEl.appendChild(li);
        });
      } catch (_) {}
    }

    async function loadSession(id) {
      try {
        const r = await fetch(`/chat/sessions/${encodeURIComponent(id)}`);
        if (!r.ok) {
          showToast('Could not load session');
          return;
        }
        const s = await r.json();
        transcript.innerHTML = '';
        sessionId = s.id;
        sessionEl.textContent = sessionId.slice(0, 8) + '…';
        (s.turns || []).forEach((t) => {
          appendMessage('You', t.user || '');
          const meta = typeof t.latency_ms === 'number' ? `${t.latency_ms} ms` : '';
          appendMessage('Zeus', t.assistant || '', meta);
        });
        await refreshSessionList();
      } catch (e) {
        showToast(String(e));
      }
    }

    async function sendNonStreaming(text) {
      const r = await fetch('/chat/message', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          session_id: sessionId,
          message: text,
          use_context: true,
        }),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) {
        showToast(data.detail || `Error ${r.status}`);
        return;
      }
      sessionId = data.session_id;
      sessionEl.textContent = sessionId.slice(0, 8) + '…';
      const meta =
        data.model_used && data.latency_ms != null
          ? `${data.model_used} · ${data.latency_ms} ms (~${data.token_estimate} tok)`
          : '';
      appendMessage('Zeus', data.assistant_message || '', meta);
      await refreshSessionList();
    }

    async function sendStreaming(text) {
      const r = await fetch('/chat/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          session_id: sessionId,
          message: text,
          use_context: true,
        }),
      });
      if (!r.ok || !r.body) {
        await sendNonStreaming(text);
        return;
      }
      const reader = r.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      const assistantDiv = appendAssistantStreaming();
      const bodyEl = assistantDiv.querySelector('.assistant-body');
      const metaEl = assistantDiv.querySelector('.msg-meta');
      let gotDone = false;
      try {
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          let idx;
          while ((idx = buf.indexOf('\n\n')) >= 0) {
            const raw = buf.slice(0, idx);
            buf = buf.slice(idx + 2);
            const lines = raw.split('\n');
            for (const line of lines) {
              if (!line.startsWith('data: ')) continue;
              let payload;
              try {
                payload = JSON.parse(line.slice(6));
              } catch {
                continue;
              }
              if (payload.type === 'token' && payload.content) {
                bodyEl.appendChild(document.createTextNode(payload.content));
                transcript.scrollTop = transcript.scrollHeight;
              } else if (payload.type === 'done') {
                gotDone = true;
                if (payload.session_id) sessionId = payload.session_id;
                sessionEl.textContent = sessionId ? sessionId.slice(0, 8) + '…' : '—';
                const parts = [];
                if (payload.model_used) parts.push(payload.model_used);
                if (payload.latency_ms != null) parts.push(`${payload.latency_ms} ms`);
                metaEl.textContent = parts.join(' · ');
              } else if (payload.type === 'error') {
                showToast(payload.detail || 'Stream error');
                if (assistantDiv.parentNode) transcript.removeChild(assistantDiv);
                await sendNonStreaming(text);
                return;
              }
            }
          }
        }
      } catch (err) {
        showToast(String(err));
      }
      if (!gotDone) {
        if (assistantDiv.parentNode) transcript.removeChild(assistantDiv);
        showToast('Stream interrupted before completion. Try again.');
        return;
      }
      await refreshSessionList();
    }

    const phaos = await initPhaos({ container: phaosRoot, enableMic: true, enableXR: true });

    document.body.addEventListener(
      'click',
      () => {
        phaos.resumeAudio?.();
      },
      { once: true },
    );

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      appendMessage('You', text);
      sendBtn.disabled = true;
      try {
        await sendStreaming(text);
      } catch (err) {
        showToast(String(err));
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    });

    document.getElementById('new-session').addEventListener('click', () => {
      sessionId = null;
      sessionEl.textContent = '—';
      transcript.innerHTML = '';
      refreshSessionList();
    });

    document.getElementById('refresh-sessions').addEventListener('click', () => refreshSessionList());
    document.getElementById('toggle-sessions').addEventListener('click', () => {
      sessionsAside.classList.toggle('collapsed');
      const btn = document.getElementById('toggle-sessions');
      btn.textContent = sessionsAside.classList.contains('collapsed') ? '▸' : '▾';
    });

    refreshSessionList();

    // ── Browser voice capture (hold-to-talk → POST /voice/interact) ────────
    const micBtn = document.getElementById('mic-btn');
    const voiceStatusEl = document.getElementById('voice-status');
    let voiceAudioCtx = null;
    let voiceStream = null;
    let voiceProcessor = null;
    let voicePCMChunks = [];
    let voiceRecording = false;

    function setVoiceStatus(msg) { voiceStatusEl.textContent = msg; }

    async function publishVoiceState(state, metadata = {}) {
      try {
        await fetch('/voice-state/publish', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ state, metadata }),
        });
      } catch (_) {}
    }

    function pcmChunksToWav(chunks, sampleRate) {
      const totalSamples = chunks.reduce((s, c) => s + c.length, 0);
      const dataBytes = totalSamples * 2;
      const buf = new ArrayBuffer(44 + dataBytes);
      const v = new DataView(buf);
      const str = (off, s) => { for (let i = 0; i < s.length; i++) v.setUint8(off + i, s.charCodeAt(i)); };
      str(0, 'RIFF'); v.setUint32(4, 36 + dataBytes, true);
      str(8, 'WAVE'); str(12, 'fmt ');
      v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
      v.setUint32(24, sampleRate, true); v.setUint32(28, sampleRate * 2, true);
      v.setUint16(32, 2, true); v.setUint16(34, 16, true);
      str(36, 'data'); v.setUint32(40, dataBytes, true);
      let off = 44;
      for (const chunk of chunks) {
        for (let i = 0; i < chunk.length; i++) { v.setInt16(off, chunk[i], true); off += 2; }
      }
      return buf;
    }

    async function startVoiceCapture() {
      if (voiceRecording) return;
      try {
        voiceStream = await navigator.mediaDevices.getUserMedia({
          audio: { sampleRate: 16000, channelCount: 1, echoCancellation: true, noiseSuppression: true },
        });
      } catch (err) {
        showToast('Mic access denied: ' + err.message);
        return;
      }
      const targetRate = 16000;
      voiceAudioCtx = new AudioContext({ sampleRate: targetRate });
      const source = voiceAudioCtx.createMediaStreamSource(voiceStream);
      // ScriptProcessor is deprecated but has universal support for this use-case
      voiceProcessor = voiceAudioCtx.createScriptProcessor(4096, 1, 1);
      voicePCMChunks = [];
      voiceRecording = true;
      voiceProcessor.onaudioprocess = (e) => {
        if (!voiceRecording) return;
        const f32 = e.inputBuffer.getChannelData(0);
        const i16 = new Int16Array(f32.length);
        for (let i = 0; i < f32.length; i++) {
          i16[i] = Math.max(-32768, Math.min(32767, Math.round(f32[i] * 32768)));
        }
        voicePCMChunks.push(i16);
      };
      source.connect(voiceProcessor);
      voiceProcessor.connect(voiceAudioCtx.destination);
      micBtn.classList.add('recording');
      setVoiceStatus('Recording…');
      publishVoiceState('listening');
    }

    async function stopVoiceCapture() {
      if (!voiceRecording) return;
      voiceRecording = false;
      voiceProcessor?.disconnect();
      voiceAudioCtx?.close();
      voiceStream?.getTracks().forEach((t) => t.stop());
      voiceAudioCtx = null; voiceStream = null; voiceProcessor = null;
      micBtn.classList.remove('recording');

      const chunks = voicePCMChunks;
      voicePCMChunks = [];
      const totalSamples = chunks.reduce((s, c) => s + c.length, 0);
      if (totalSamples < 3200) { // < 0.2 s at 16kHz — ignore tap noise
        setVoiceStatus('');
        publishVoiceState('idle');
        return;
      }

      setVoiceStatus('Processing…');
      publishVoiceState('processing');
      micBtn.disabled = true;
      sendBtn.disabled = true;

      try {
        const wav = pcmChunksToWav(chunks, 16000);
        const form = new FormData();
        form.append('audio', new Blob([wav], { type: 'audio/wav' }), 'voice.wav');
        if (sessionId) form.append('session_id', sessionId);

        const r = await fetch('/voice/interact', { method: 'POST', body: form });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(data.detail || `Error ${r.status}`);

        if (data.session_id) {
          sessionId = data.session_id;
          sessionEl.textContent = sessionId.slice(0, 8) + '…';
        }
        appendMessage('You', data.transcript || '(no transcript)');
        const meta = data.model_used && data.latency_ms != null
          ? `${data.model_used} · ${data.latency_ms} ms`
          : '';
        appendMessage('Zeus', data.assistant_message || '', meta);
        setVoiceStatus('');
        await refreshSessionList();
      } catch (err) {
        showToast(String(err));
        setVoiceStatus('Voice error — try again');
      } finally {
        micBtn.disabled = false;
        sendBtn.disabled = false;
        publishVoiceState('idle');
      }
    }

    micBtn.addEventListener('mousedown', (e) => { e.preventDefault(); startVoiceCapture(); });
    micBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startVoiceCapture(); }, { passive: false });
    micBtn.addEventListener('mouseup', stopVoiceCapture);
    micBtn.addEventListener('mouseleave', stopVoiceCapture);
    micBtn.addEventListener('touchend', stopVoiceCapture);
    micBtn.addEventListener('touchcancel', stopVoiceCapture);
    // ── End voice capture ────────────────────────────────────────────────────

    fetch('/status')
      .then((r) => r.json())
      .then((s) => {
        document.getElementById('env-badge').textContent = s.environment || '';
      })
      .catch(() => {});
  </script>
</body>
</html>
