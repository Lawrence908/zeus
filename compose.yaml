# zeus/compose.yaml — Zeus service stack
# Usage: docker compose up -d
#
# Ollama is configured for one NVIDIA GPU via deploy.resources (requires
# nvidia-container-toolkit on the host). For a CPU-only host, remove the
# `deploy:` block under `ollama` or use a machine without the NVIDIA stack.

services:
  # --- Mnemosyne: Vector DB ---
  qdrant:
    image: qdrant/qdrant:latest
    container_name: zeus-qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      # Fewer lines than default INFO (every HTTP request); warnings/errors still show
      - QDRANT__LOG_LEVEL=${QDRANT_LOG_LEVEL:-WARN}
    restart: unless-stopped
    networks:
      - web

  # --- Ollama: Local LLM runtime ---
  # Prod: serves Qwen2.5-7B-Instruct Q4_K_M on RTX 3080
  # Dev: serves test models on RTX 5080
  ollama:
    # PINNED, NOT :latest, AND THAT IS DELIBERATE.
    # This node is the no-failover target for /api/embed* (see ollama-gateway
    # Caddyfile). A runtime version change can move nomic-embed-text's vector
    # space without any error: embeddings keep returning 200, cosine ranking
    # silently degrades against the ~315k vectors already in zeus_knowledge /
    # zeus_news / zeus_memories, and reindexing is the only repair. With :latest
    # any unrelated `docker compose pull` could trigger that at an arbitrary time.
    # Bump this tag only as a deliberate act, and verify first:
    #   1. capture reference embeddings on the OLD version
    #   2. bump + recreate
    #   3. re-embed the same probes; require per-vector cosine >0.9999 AND
    #      max pairwise-cosine delta <1e-4 (relative geometry drives recall)
    #
    # 0.40.4 WAS TESTED 2026-10-15 AND FAILED THAT CHECK. DO NOT BUMP TO IT.
    # Same model digest (0a109f422b47), runtime change only, yet nomic-embed-text
    # moved: per-vector cosine vs 0.13.3 fell to 0.789 ('SELECT * FROM ...'),
    # 0.902 (unicode), 0.947 (long prose), 0.961 (plain sentence); max pairwise-
    # cosine delta 0.061. Short/alphanumeric strings were unaffected (0.99999+),
    # so a casual spot-check PASSES and hides it. Re-running the same probes on
    # restored 0.13.3 gave cosine 1.00000000 and pairwise delta 0.0, confirming
    # the test has no noise floor and the drift was entirely the runtime.
    # Upgrading therefore requires reindexing ~318k vectors (zeus_knowledge
    # 307454 + zeus_news 8011 + zeus_memories_hybrid 1853 + zeus_memories 788
    # + mem0migrations 27), or splitting embed onto its own pinned 0.13.3 node.
    # Rollback image also preserved locally as ollama/ollama:rollback-0.13.3.
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-0.13.3}
    container_name: zeus-ollama
    ports:
      - "${OLLAMA_PORT:-11435}:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-2}
      # Zeus uses Ollama for both nomic-embed-text and the chat model; 1 forces
      # constant unload/reload on the GPU (very slow). 2 fits ~10GB cards (Qwen 7B Q4 + embed).
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-2}
      # Pin loaded models so embedder doesn't unload between bursts (default is 5m,
      # which causes the runner to respawn and re-probe CUDA — slow, and tickles the
      # NVML-after-daemon-reload bug that drops the embedder onto CPU).
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-24h}
      # Server-wide default context window for any client that doesn't pass its own
      # options.num_ctx (e.g. the meeting-notes app hitting this Ollama directly on
      # 11435). Raised from Ollama's built-in 4096 now that mcp-mesh no longer holds
      # 5.6GB of VRAM permanently — verify size_vram after changing this.
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-8192}
      # Quieter llama.cpp / GGUF load traces in logs (unset or "info" when debugging loads)
      - GGML_LOG_LEVEL=${OLLAMA_GGML_LOG_LEVEL:-error}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      web:
        aliases:
          - nomad_ollama  # Allows NOMAD to reach Zeus's Ollama as http://nomad_ollama:11434

  # --- Orpheus STT: WhisperLiveKit (WebSocket) ---
  whisper:
    image: ghcr.io/collabora/whisperlive-cpu:latest
    container_name: zeus-whisper
    # REST API transcribes uploads with vad_filter=False; WebSocket path often runs Silero VAD
    # and strips whole short clips. Zeus /voice/interact uses WHISPER_REST_URL when set.
    command:
      - python
      - run_server.py
      - --enable_rest
      - --rest_port
      - "8000"
      - --port
      - "9090"
    ports:
      - "${WHISPER_PORT:-9090}:9090"
    environment:
      - WHISPER_MODEL=${WHISPER_MODEL:-small}
      - WHISPER_DEVICE=cpu
    restart: unless-stopped
    # Raw TCP checks hit the WebSocket port without an Upgrade handshake; the server
    # logs ERROR on every probe. Rely on restart policy instead of port health.
    healthcheck:
      disable: true
    networks:
      - web

  # --- Orpheus TTS: Kokoro-FastAPI (OpenAI-compatible /v1/audio/speech) ---
  # CPU image: keeps the 3080 free for Whisper + Ollama. Kokoro-82M is fast on
  # CPU (well above realtime for short replies) and bundles its weights, so no
  # first-run download. Browser orb and host Orpheus both reach it via
  # ZEUS_TTS_URL=http://tts:8880. Host-published on 5050 for the host pipeline.
  tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.6.0
    container_name: zeus-tts
    ports:
      - "${ZEUS_TTS_PORT:-5050}:8880"
    environment:
      - USE_GPU=false
      # daedalus is a busy 24-core host (Minecraft/neo4j/netdata baseline). Torch
      # defaults to one thread PER CORE per request, so concurrent synths caused a
      # run-queue meltdown (load 70+). Bound each synth to a few threads; combined
      # with the cpus cap below it stays a good citizen. Short replies still synth
      # well above realtime.
      - OMP_NUM_THREADS=4
      - MKL_NUM_THREADS=4
      - TORCH_NUM_THREADS=4
      - NUMEXPR_NUM_THREADS=4
    cpus: 6.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8880/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - web

  # --- Aegis: NemoClaw + OpenShell (LAB-119) ---
  # Not a compose service: NVIDIA ships NemoClaw via host installer (Node + Docker
  # sandboxes + OpenShell). See https://docs.nvidia.com/nemoclaw/latest/get-started/quickstart.html
  # Zeus applies in-process YAML policies from zeus/safety/policies/ when
  # ZEUS_AEGIS_ENABLED=1. Optional NEMOCLAW_RUNTIME_URL reserved for a future HTTP sidecar.

  # --- Zeus Core: FastAPI API bus ---
  zeus-core:
    build:
      context: .
      dockerfile: zeus/core/Dockerfile
    container_name: zeus-core
    ports:
      - "${ZEUS_CORE_PORT:-8203}:8000"
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      # Via ollama-gateway (:11440), not the local ollama container directly.
      # The gateway sends generation to Apollo's 5080 first (falling back to the
      # local 3080) and PINS /api/embed* to the 3080 with no failover, so vectors
      # written to Qdrant always come from one model on one node. See
      # services/ollama-gateway/Caddyfile for why embeddings must not fail over.
      # Consequence: any model Zeus may request for GENERATION must exist with an
      # identical tag on BOTH nodes, or it 404s when Apollo is the live upstream.
      - OLLAMA_URL=http://ollama-gateway:11440
      # Cross-encoder rerank runs in services/rerank-gateway, not in this image.
      # It used to be in-process via sentence-transformers, which made
      # zeus/memory/reranker.py the only torch consumer in the tree and dragged
      # the CUDA wheels plus a re-downloaded 1.1GB checkpoint into a 22GB image.
      # The gateway owns an ordered TEI pool (apollo's 5080 first, a daedalus CPU
      # node as fallback) with health probing and failover.
      #
      # Deliberately NO depends_on: KnowledgeStore._rerank and MemoryStore._rerank
      # both catch and keep the pre-rerank order, so an outage degrades ranking
      # rather than breaking retrieval. A hard dependency would contradict that
      # and couple two independently deployed repos.
      #
      # The timeout must stay ABOVE the gateway's own RERANK_REQUEST_TIMEOUT (15s)
      # or a truncated read here replaces the gateway's error text with a bare
      # timeout, hiding which node failed and why.
      - ZEUS_RERANKER_URL=http://rerank-gateway:8191
      - ZEUS_RERANKER_TIMEOUT=25.0
      - WHISPER_URL=ws://whisper:9090
      - WHISPER_REST_URL=http://whisper:8000
      # Server-side TTS for the browser voice orb (/voice/tts proxy). Kokoro
      # speaks OpenAI-style /v1/audio/speech; overrides the legacy VOICEBOX_URL.
      - ZEUS_VOICE_TTS_ENABLED=1
      - ZEUS_TTS_URL=http://tts:8880
      - ZEUS_TTS_VOICE=${ZEUS_TTS_VOICE:-af_heart}
      # Olympian tools loop back to Core via HTTP; inside the container Core
      # listens on 8000, NOT the host-published 8203. Without this override
      # every olympian_* call dies with "connection refused".
      - ZEUS_CORE_URL=http://127.0.0.1:8000
      # Written .md artifacts (briefings, research reports) must land on the
      # writable, host-persisted mount. /app/zeus itself is bind-mounted
      # read-only (dev hot-edit), so only /app/zeus/data (rw, = host
      # zeus/zeus/data) can be written. The code defaults
      # (/home/chris/zeus/docs/...) are container-internal and ephemeral. The
      # knowledge-store ingest is durable either way.
      - ZEUS_BRIEFINGS_DIR=/app/zeus/data/briefings
      - ZEUS_DEEP_RESEARCH_DIR=/app/zeus/data/research
      - ZEUS_SCRUTINY_WATCH_DB=/app/zeus/data/scrutiny_watch.db
    volumes:
      - zeus_data:/app/zeus/data
    depends_on:
      qdrant:
        condition: service_started
      ollama:
        condition: service_healthy
    restart: unless-stopped
    # /health = process up only. /status still probes Qdrant + Ollama (use for real checks).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - web

volumes:
  qdrant_data:
  ollama_data:
  zeus_data:

networks:
  web:
    external: true
    name: homelab-web
