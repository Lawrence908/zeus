# tests/retrieval_eval_queries/knowledge_questions.yaml
#
# Ground-truth queries whose answer lives in the Knowledge (Library) layer:
# bulk raw chunks ingested from chatgpt, obsidian, markdown, homelab, git,
# newsletter. These are the original 30 hand-written retrieval-eval queries,
# migrated verbatim from tests/retrieval_eval.py::GROUND_TRUTH.
#
# expected_layer: knowledge  -> a keyword hit in the Knowledge block counts.
#   A hit that appears only in Profile/Memories is a `layer_miss` for these.
#
# The accepted baseline is tests/retrieval_eval_baseline.json. Themis may
# propose changes to that file but never write it (see docs/themis spec).

