# tests/retrieval_eval_queries/pending/knowledge_own_material.yaml
#
# UNREVIEWED CANDIDATES, curated 2026-09-18. Still pending: `load_suite()`
# excludes pending/ unless include_pending=True, so nothing here is scored until
# a human promotes it.
#
# Every query here is grounded in CHRIS'S OWN material: course notes, project
# docs, the homelab ops series. Queries grounded in the kiwix reference corpus
# were moved to knowledge_kiwix_parked.yaml, because `CLAUDE.md` says reference
# content is live-proxied and never ingested. Those chunks are in zeus_knowledge
# anyway, so a suite resting on them would collapse the day that discrepancy is
# fixed, for reasons unrelated to retrieval quality.
#
# Construction rules (the second is the non-obvious one):
#   1. A query must not contain its own expected keywords. The active 30 fail
#      this, which is why they saturate: "What is the Zeus project?" with
#      keywords [zeus, assistant, homelab] is a BM25 lookup, not a retrieval
#      test.
#   2. It should target a CROWDED document family. A query whose target document
#      is unique in the corpus stays easy however it is worded; that is corpus
#      sparsity, not retrieval difficulty, and rewording cannot fix it.
#
# `keywords_hit` is ANY-match, and uses \b word boundaries for single tokens, so
# a keyword may not begin with punctuation (`--category` can never match).
#
# Dropped during review: one query whose target is unretrievable even under a
# literal probe (it would sit at zero forever and manufacture fake headroom), and
# two duplicates that asked an existing question a second way.

