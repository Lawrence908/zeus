  expected_keywords: [prescriptivity, universalizability, overridingness]
  expected_layer: knowledge
- query: "The property that a moral rule should be able to guide and evaluate conduct"
  expected_keywords: [prescriptivity, action-guiding]
  expected_layer: knowledge
- query: "The property that a moral rule must outrank competing considerations"
  expected_keywords: [overridingness]
