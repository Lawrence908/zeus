# tests/retrieval_eval_queries/pending/knowledge_hard_candidates.yaml
#
# UNREVIEWED CANDIDATES. Nothing here is scored until a human moves it into the
# active suite. `load_suite()` excludes pending/ unless include_pending=True.
#
# Why these exist: with rerank on, the active 30-query suite scores hit@1 1.0 -
# 30 of 30 at rank 1. A saturated suite cannot tell good retrieval from better,
# so the acceptance gate's only ratchet has no headroom and would reject every
# change forever.
#
# Diagnosis: the active queries carry their own answers. "What is the Zeus
# project?" with expected_keywords [zeus, assistant, homelab] is a BM25 lookup,
# not a retrieval test. That is the same lexical-overlap bias docs/themis-spec.md
# warns about for minted queries; it was already true of the hand-written ones.
#
# Construction rule applied here: THE QUERY MUST NOT CONTAIN ITS OWN EXPECTED
# KEYWORDS. Each is a paraphrase a person might actually type, and the keywords
# are terms from the target document's body. Minted from documents (grouped by
# source_id), never from a single chunk, per the doc-identity anchor decision.
#
# Every one is grounded in a chunk sampled from the live zeus_knowledge
# collection on 2026-09-18, so the answers are known to exist in the corpus.
# Measured difficulty is recorded in the review notes below.

# -- personal course notes: philosophy/ethics --
- query: "What are the five characteristics a moral rule has to have?"
  expected_keywords: [prescriptivity, universalizability, overridingness]
  expected_layer: knowledge
- query: "The view that right and wrong come down to how one person feels about it"
  expected_keywords: [subjectivism, relativism, feelings]
  expected_layer: knowledge
- query: "Why do critics say a self-interest-only theory cannot settle disputes between people?"
  expected_keywords: [egoism, conflicts of interests, moral theory]
  expected_layer: knowledge
- query: "When did the movement for women's emancipation give rise to the term we use for it now?"
  expected_keywords: [feminism, emancipation, 19th century]
  expected_layer: knowledge

