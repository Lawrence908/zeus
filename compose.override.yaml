# compose.override.yaml — Local dev overlay for zeus-core.
#
# Auto-loaded by `docker compose` when present. Bind-mounts the host's `zeus/`
# package into the container so Python edits take effect without rebuilding the
# image. Restart the container (or re-run `docker exec ... python -m zeus.bench`
# etc.) to pick up changes — no rebuild needed for pure-Python edits.
#
# Disable temporarily with:
#   docker compose -f compose.yaml up -d
#
# Or rename this file to `compose.override.yaml.disabled` before deploying to
# olympus/prod, where you want the baked image so you know exactly what's
# running.

services:
  zeus-core:
    volumes:
      - ./zeus:/app/zeus:ro
      # Writable data dir so docker cp (OAuth tokens, bookmarks.html, etc.)
      # and per-source state survives restarts without poking the named volume.
      - ./zeus/data:/app/zeus/data
      # Obsidian vault (LiveSync headless mirror) — read-only ingest input.
      - /home/chris/data/headless-obsidian-vault:/home/chris/data/headless-obsidian-vault:ro
      # Kiwix ZIM archives (static reference snapshots) — read-only ingest input
      # for KiwixZimSource. Large ZIMs are served live via KiwixClient instead.
      - /mnt/hermes/appdata/kiwix/zims:/mnt/hermes/appdata/kiwix/zims:ro
      # Olympian tool pack workspace (status / inbox / actions). Mounted at
      # /root/.zeus so the in-container `~` expansion matches the defaults
      # in zeus.core.{admin,inbox,actions}. Writable: /inbox/append needs to
      # write, action scripts need exec bits preserved (bind mount keeps them).
      - /home/chris/.zeus:/root/.zeus
    environment:
      # Don't write .pyc files into the read-only bind mount.
      - PYTHONDONTWRITEBYTECODE=1
      - OBSIDIAN_VAULT_PATH=/home/chris/data/headless-obsidian-vault
      - ZEUS_KIWIX_ZIM_DIR=/mnt/hermes/appdata/kiwix/zims
      # Olympian tool pack — defaults already point at ~/.zeus/*; set the
      # file-search roots explicitly so olympian_file_search covers both the
      # Olympian workspace and the Obsidian vault. Writes stay gated by
      # ZEUS_MCP_ALLOW_WRITE; the action runner additionally requires
      # ZEUS_ACTIONS_ENABLED. Both default off — flip them in .env when ready.
      - ZEUS_FILE_READ_ROOTS=/root/.zeus,/home/chris/data/headless-obsidian-vault
