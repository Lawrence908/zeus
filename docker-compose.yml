# docker-compose.yml
# Zeus Personal AI Assistant — Service Definitions
#
# Services:
#   - qdrant: Vector database (mnemosyne storage backend)
#   - ollama: Local LLM inference (prod mode)
#   - zeus-core: FastAPI bus and main router

services:
  # =========================================
  # Qdrant — Vector Database
  # =========================================
  # Mnemosyne storage backend for semantic search
  # Docs: https://qdrant.tech/documentation/
  qdrant:
    image: qdrant/qdrant:latest
    container_name: zeus-qdrant
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =========================================
  # Ollama — Local LLM Inference
  # =========================================
  # Production model server with GPU passthrough
  # RTX 3080 (10GB VRAM) — runs Qwen2.5-7B-Instruct Q4_K_M
  #
  # NOTE: Placeholder — uncomment deploy section when running on Olympus (3080 server)
  # Models to pull after start:
  #   docker exec zeus-ollama ollama pull qwen2.5:7b-instruct-q4_K_M
  #   docker exec zeus-ollama ollama pull nomic-embed-text
  ollama:
    image: ollama/ollama:latest
    container_name: zeus-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    restart: unless-stopped
    # GPU passthrough for RTX 3080
    # Uncomment when deploying to Olympus (production server)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # =========================================
  # Zeus Core — FastAPI Bus
  # =========================================
  # Main API router, health endpoints, service orchestration
  #
  # NOTE: Placeholder — build context will be added when Dockerfile is created
  zeus-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zeus-core
    ports:
      - "8000:8000"
    environment:
      - ZEUS_ENV=${ZEUS_ENV:-dev}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - OLLAMA_HOST=http://ollama:11434
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    # Placeholder — uncomment when Dockerfile exists
    profiles:
      - full  # Only start with: docker compose --profile full up

volumes:
  qdrant_data:
    driver: local
  ollama_data:
    driver: local

# =========================================
# Usage Notes
# =========================================
#
# Development (Qdrant + Ollama only):
#   docker compose up -d qdrant ollama
#
# Full stack (when Dockerfile exists):
#   docker compose --profile full up -d
#
# Check Qdrant health:
#   curl http://localhost:6333/readiness
#
# Pull models after Ollama starts:
#   docker exec zeus-ollama ollama pull qwen2.5:7b-instruct-q4_K_M
#   docker exec zeus-ollama ollama pull nomic-embed-text
#
# For dev on tower (5080), Claude API is used via ANTHROPIC_API_KEY
# For prod on server (3080), Ollama handles inference
