# tinyproxy.conf - allowlist-only egress proxy for the swarm sandbox.
User tinyproxy
Group tinyproxy
Port 8888
Listen 0.0.0.0
Timeout 600

# Deny everything, then allow only hosts matching the filter file. Applies to
# both plain requests and HTTPS CONNECT (so `api.anthropic.com:443` is gated).
FilterDefaultDeny Yes
Filter "/etc/tinyproxy/allowlist"
FilterExtended On
FilterCaseSensitive Off
FilterURLs Off

# Only clients on the internal docker network reach this proxy; keep it simple.
Allow 0.0.0.0/0

MaxClients 50
StartServers 2
DisableViaHeader Yes
