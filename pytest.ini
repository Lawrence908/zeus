[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py *_test.py retrieval_eval.py
# Coverage is report-only: it prints a summary and writes coverage.xml (for CI
# artifact upload) but never fails the run on a threshold. Add --cov-fail-under
# later once a baseline is agreed. Requires pytest-cov (in requirements-dev.txt).
addopts = --cov=zeus --cov-report=term-missing --cov-report=xml
